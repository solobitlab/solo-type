name: Build Native Installers (macOS, Windows, Linux)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build macOS DMG Installer
        run: ./gradlew desktopTest packageDmg --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SoloType-macOS-DMG
          path: build/compose/binaries/main/dmg/*.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build Windows Setup Wizard (.exe & .msi)
        run: .\gradlew.bat desktopTest packageExe packageMsi --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SoloType-Windows-Setup
          path: |
            build/compose/binaries/main/exe/*.exe
            build/compose/binaries/main/msi/*.msi

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build Linux .deb and Portable Bundle
        run: |
          ./gradlew desktopTest packageDeb createDistributable --no-daemon
          mkdir -p linux-bundle
          cp build/compose/binaries/main/deb/*.deb linux-bundle/
          cp -r build/compose/binaries/main/app/SoloType linux-bundle/
          cp packaging/linux/install.sh packaging/linux/uninstall.sh linux-bundle/
          chmod +x linux-bundle/install.sh linux-bundle/uninstall.sh
          tar -czf SoloType-Linux-x64.tar.gz -C linux-bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: SoloType-Linux
          path: |
            build/compose/binaries/main/deb/*.deb
            SoloType-Linux-x64.tar.gz

  release:
    needs: [build-macos, build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
